[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-desk"
version = "0.3.0"
description = "Local-first orchestration layer that coordinates work across Codex, Claude Code, and local models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Miguel" }]
keywords = ["ai", "agents", "orchestration", "codex", "claude-code", "local-first", "cli"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Git integration is deferred to Phase 4 (see docs/decisions.md). Kept as an extra so the
# core engine has zero Git runtime dependency in the MVP.
git = ["gitpython>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
agentdesk = "agentdesk.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["agentdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
